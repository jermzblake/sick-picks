[project]
name = "sick-picks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jermzblake", email = "jermzblake@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=5.2,<5.3",
    "django-htmx>=1.29.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.1.1",
]

[project.scripts]
sick-picks = "sick_picks:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
