<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Sick Picks{% endblock %}</title>
  {% load django_htmx %}
  {% htmx_script %}
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      htmx.config.responseHandling = [
        {code: "204", swap: false},
        {code: "[23]..", swap: true},
        {code: "422", swap: true},
        {code: "[45]..", swap: false, error: true},
      ];
    });
  </script>
</head>
<body>
  <header>
    <a href="{% url 'game-slate' %}">Games</a>
    <a href="{% url 'pick-history' %}">Picks</a>
    {% if user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Log out</button>
      </form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
