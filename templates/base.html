<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sick Picks{% endblock %}</title>
  {% load static %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'picks/css/team-colors.css' %}">
  <link rel="stylesheet" href="{% static 'picks/css/slate.css' %}">
  <script>
    (function () {
      var zone;
      try {
        zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
      } catch (error) {
        return;
      }
      if (!zone) return;
      var match = document.cookie.match(/(?:^|; )timezone=([^;]*)/);
      var current = '';
      if (match) {
        try {
          current = decodeURIComponent(match[1]);
        } catch (error) {
          current = '';
        }
      }
      if (current === zone) return;
      try {
        if (sessionStorage.getItem('timezone-reload') === zone) return;
        sessionStorage.setItem('timezone-reload', zone);
      } catch (error) {
        return;
      }
      var secure = location.protocol === 'https:' ? '; Secure' : '';
      document.cookie = 'timezone=' + encodeURIComponent(zone)
        + '; Path=/; Max-Age=31536000; SameSite=Lax' + secure;
      location.reload();
    })();
  </script>
  {% load django_htmx %}
  {% htmx_script %}
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      htmx.config.responseHandling = [
        {code: "204", swap: false},
        {code: "[23]..", swap: true},
        {code: "422", swap: true},
        {code: "[45]..", swap: false, error: true},
      ];
    });
  </script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="site-header">
    <div class="site-wrap site-header__inner">
      <a class="site-brand" href="{% url 'home' %}">Sick Picks</a>
      {% if user.is_authenticated %}
        <nav class="site-nav">
          <a href="{% url 'game-slate' %}">Games</a>
          <a href="{% url 'pick-history' %}">Picks</a>
        </nav>
        <div class="site-header__actions">
          {% if user.is_staff %}
            <a href="{% url 'admin:index' %}">Admin</a>
          {% endif %}
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit">Log out</button>
          </form>
        </div>
      {% endif %}
    </div>
  </header>
  <main class="site-main">
    <div class="site-wrap">
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
