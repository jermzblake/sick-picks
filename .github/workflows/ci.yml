name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: sick_picks
          POSTGRES_USER: sick_picks
          POSTGRES_PASSWORD: sick_picks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sick_picks -d sick_picks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgresql://sick_picks:sick_picks@localhost:5432/sick_picks
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - run: make ci
